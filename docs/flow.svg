<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
  <title id="t">How it works</title>
  <desc id="d">Four steps: save your profile once, open an application form, press Ctrl+Shift+F, review and submit yourself.</desc>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .n{font-size:26px;font-weight:800;fill:#fff;text-anchor:middle}
    .h{font-size:20px;font-weight:700;fill:#1b1b1f;text-anchor:middle}
    .s{font-size:15px;fill:#5b6070;text-anchor:middle}
    @media (prefers-color-scheme:dark){.h{fill:#f3f4f6}.s{fill:#aab1c4}.card{fill:#161b2c;stroke:#2c3555}}
    .card{fill:#fff;stroke:#d9def0}
  </style>
  <g>
    <rect class="card" x="8" y="20" width="268" height="180" rx="18"/>
    <rect class="card" x="316" y="20" width="268" height="180" rx="18"/>
    <rect class="card" x="624" y="20" width="268" height="180" rx="18"/>
    <rect class="card" x="932" y="20" width="260" height="180" rx="18"/>
    <circle cx="142" cy="62" r="26" fill="#1e3a8a"/><text class="n" x="142" y="71">1</text>
    <circle cx="450" cy="62" r="26" fill="#1a56db"/><text class="n" x="450" y="71">2</text>
    <circle cx="758" cy="62" r="26" fill="#0d9488"/><text class="n" x="758" y="71">3</text>
    <circle cx="1062" cy="62" r="26" fill="#16a34a"/><text class="n" x="1062" y="71">4</text>
    <text class="h" x="142" y="122">Save your profile once</text><text class="s" x="142" y="150">Name, links, education,</text><text class="s" x="142" y="172">answers you reuse</text>
    <text class="h" x="450" y="122">Open an application</text><text class="s" x="450" y="150">Any job, internship</text><text class="s" x="450" y="172">or program form</text>
    <text class="h" x="758" y="122">Press Ctrl + Shift + F</text><text class="s" x="758" y="150">Or click the icon and</text><text class="s" x="758" y="172">“Fill this page”</text>
    <text class="h" x="1062" y="122">Check and submit</text><text class="s" x="1062" y="150">It never submits for you.</text><text class="s" x="1062" y="172">Missing fields are flagged</text>
  </g>
  <g fill="none" stroke="#9aa1b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M284 110h24m-8-8l8 8-8 8"/><path d="M592 110h24m-8-8l8 8-8 8"/><path d="M900 110h24m-8-8l8 8-8 8"/>
  </g>
</svg>
