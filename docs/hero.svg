<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">One-Click Form Filler</title>
  <desc id="d">A job application form being filled in automatically, field by field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#1a56db"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="fillbar" x1="0" x2="1"><stop offset="0" stop-color="#1a56db"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1b4d" flood-opacity="0.35"/></filter>
    <clipPath id="r"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="1090" cy="40" r="170" fill="#fff" opacity="0.07"/>
    <circle cx="610" cy="430" r="140" fill="#fff" opacity="0.06"/>
    <circle cx="90" cy="360" r="90" fill="#f5a623" opacity="0.22"/>
    <rect x="40" y="56" width="10" height="60" rx="5" fill="#f5a623"/>

    <text x="72" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="60" font-weight="800" fill="#fff">One-Click</text>
    <text x="72" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="60" font-weight="800" fill="#fff">Form Filler</text>
    <text x="72" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" fill="#dbe7ff">Stop retyping yourself on every application.</text>
    <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600">
      <rect x="72" y="312" width="150" height="38" rx="19" fill="#fff" opacity="0.16"/><text x="147" y="337" text-anchor="middle" fill="#fff">English + عربي</text>
      <rect x="234" y="312" width="140" height="38" rx="19" fill="#fff" opacity="0.16"/><text x="304" y="337" text-anchor="middle" fill="#fff">Local-first</text>
      <rect x="386" y="312" width="150" height="38" rx="19" fill="#fff" opacity="0.16"/><text x="461" y="337" text-anchor="middle" fill="#fff">Ctrl + Shift + F</text>
    </g>

    <g filter="url(#sh)">
      <rect x="690" y="52" width="440" height="316" rx="20" fill="#fff"/>
    </g>
    <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
      <rect x="690" y="52" width="440" height="46" rx="20" fill="#eef2ff"/><rect x="690" y="78" width="440" height="20" fill="#eef2ff"/>
      <circle cx="716" cy="75" r="6" fill="#f87171"/><circle cx="736" cy="75" r="6" fill="#fbbf24"/><circle cx="756" cy="75" r="6" fill="#34d399"/>
      <text x="780" y="81" font-size="14" fill="#5b6070">Apply · Data Analyst</text>

      <text x="716" y="132" font-size="13" font-weight="600" fill="#374151">Full name</text>
      <rect x="716" y="140" width="388" height="34" rx="8" fill="#fff" stroke="#9aa1b5"/>
      <text x="728" y="163" font-size="16" fill="#111827" opacity="0"><tspan>Sara Haddad</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.16;0.92;1" dur="7s" repeatCount="indefinite"/></text>

      <text x="716" y="206" font-size="13" font-weight="600" fill="#374151">Email</text>
      <rect x="716" y="214" width="388" height="34" rx="8" fill="#fff" stroke="#9aa1b5"/>
      <text x="728" y="237" font-size="16" fill="#111827" opacity="0"><tspan>sara.haddad@example.com</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.28;0.92;1" dur="7s" repeatCount="indefinite"/></text>

      <text x="716" y="280" font-size="13" font-weight="600" fill="#374151">University</text>
      <rect x="716" y="288" width="388" height="34" rx="8" fill="#fff" stroke="#9aa1b5"/>
      <text x="728" y="311" font-size="16" fill="#111827" opacity="0"><tspan>Sample University</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.40;0.92;1" dur="7s" repeatCount="indefinite"/></text>

      <g opacity="0">
        <rect x="944" y="326" width="160" height="30" rx="15" fill="#16a34a"/>
        <text x="1024" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">✓ 11 fields filled</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="7s" repeatCount="indefinite"/>
      </g>
      <rect x="716" y="332" width="0" height="4" rx="2" fill="url(#fillbar)">
        <animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.04;0.45;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
