<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>My applications · One-Click Form Filler</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px 16px 60px;color:#1b1b1f;background:#fff}
  h1{margin:0 0 4px}
  .muted{color:#4a4f5c}
  .tools{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end;margin:16px 0}
  label{display:block;font-weight:600;font-size:13px}
  input,textarea,select{display:block;width:100%;box-sizing:border-box;min-height:44px;padding:8px 10px;margin-top:4px;font:inherit;border:1px solid #6b7080;border-radius:6px;background:#fff;color:inherit}
  textarea{min-height:44px;resize:vertical}
  button,a.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;min-width:44px;padding:0 16px;font:inherit;font-weight:600;border:1px solid #1a56db;border-radius:8px;background:#fff;color:#1a56db;cursor:pointer;text-decoration:none}
  :focus-visible{outline:3px solid #f5a623;outline-offset:2px}
  ul{list-style:none;margin:0;padding:0}
  li.app{border:1px solid #d5d7dd;border-radius:10px;padding:12px 16px;margin:0 0 12px;display:grid;grid-template-columns:1fr 180px;gap:8px 16px}
  li.app h2{font-size:16px;margin:0;overflow-wrap:anywhere}
  li.app h2 a{display:inline-flex;align-items:center;min-height:44px}
  li.app .meta{grid-column:1;margin:0;overflow-wrap:anywhere}
  li.app .status{grid-column:2;grid-row:1 / span 2}
  li.app .notes{grid-column:1 / -1}
  li.app .del{grid-column:1 / -1;justify-self:start;color:#b3261e;border-color:#b3261e}
  #summary{font-size:18px;font-weight:700;margin:12px 0 0}
  #empty{padding:20px;border:1px dashed #6b7080;border-radius:10px}
  .nav{margin:0 0 12px}
  .nav a{color:#1a56db}
  @media (max-width:600px){
    .tools{grid-template-columns:1fr}
    li.app{grid-template-columns:1fr}
    li.app .status{grid-column:1;grid-row:auto}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<p class="nav"><a href="options.html">&larr; <span data-s="backToProfile"></span></a></p>
<h1 data-s="title"></h1>
<p class="muted" data-s="privacy"></p>
<p id="summary" role="status" aria-live="polite"></p>
<p id="msg" class="muted" role="status" aria-live="polite"></p>
<div class="tools">
  <label><span data-s="search"></span><input id="q" type="search" dir="auto"></label>
  <label><span data-s="filter"></span><select id="f"></select></label>
  <button type="button" id="csv" data-s="exportCsv"></button>
</div>
<ul id="list" aria-label="Applications"></ul>
<div id="empty" hidden></div>
<script src="history.js"></script>
</body></html>
