<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="popup.docTitle"></title>
<style>
  body{font:14px system-ui,sans-serif;width:260px;margin:0;padding:14px;color:#1b1b1f}
  button{width:100%;min-height:44px;font-size:15px;font-weight:600;border:0;border-radius:8px;background:#1a56db;color:#fff;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
  label{display:flex;gap:8px;align-items:center;margin:12px 0;min-height:24px}
  select{width:100%;min-height:44px;font:inherit;padding:0 8px;margin-bottom:10px;border:1px solid #6b7080;border-radius:6px}
  #status{margin:10px 0 0;min-height:20px} .err{color:#b3261e} .ok{color:#17663a}
  a{color:#1a56db}
  #missing .warn{margin:10px 0 4px;font-weight:700;color:#7a1710} #missing ul{margin:0 0 8px;padding-inline-start:20px} #missing li{margin:2px 0}
  /* lock screen (popup-security.js) */
  #unlock input{display:block;width:100%;box-sizing:border-box;min-height:44px;font:inherit;padding:0 8px;margin:4px 0 10px;border:1px solid #6b7080;border-radius:6px}
  #unlock p{margin:0 0 10px}
  #allowSite{background:#fff;color:#1a56db;border:1px solid #1a56db;margin-top:10px}
  #backup{border:1px solid #f5a623;background:#fff8e6;border-radius:8px;padding:10px;margin-bottom:12px}
  #backup p{margin:0 0 8px} #backup button{margin-top:6px}
  #backup .later{background:#fff;color:#1a56db;border:1px solid #1a56db}
  #aiSuggest{background:#fff;color:#1a56db;border:1px solid #1a56db;margin-top:10px}
  #aiMsg:empty{display:none} #aiMsg{margin:6px 0 0}
  #lockLink{background:none;border:0;color:#1a56db;text-decoration:underline;width:auto;min-height:44px;font-size:14px;font-weight:400;padding:0}
  .ff-lang{display:block;margin:12px 0 0;font-size:13px}
  .ff-lang select{margin:4px 0 0}
  #missing li{overflow-wrap:anywhere}
  body{overflow-wrap:anywhere}
</style></head><body>
<form id="unlock" hidden>
  <p><strong data-i18n="lock.title"></strong></p>
  <label for="pass" style="display:block;margin:0" data-i18n="lock.passphrase"></label>
  <input type="password" id="pass" autocomplete="current-password" required>
  <button type="submit" data-i18n="lock.unlock"></button>
  <p id="unlockErr" class="err" role="alert"></p>
</form>
<div id="main">
<div id="backup" role="region" data-i18n-aria-label="backup.region" hidden></div>
<label for="profile" data-i18n="popup.profile"></label>
<select id="profile"></select>
<button id="fill" type="button" data-i18n="popup.fill"></button>
<button type="button" id="allowSite" hidden></button>
<button type="button" id="aiSuggest" data-i18n="ai.menuTitle" hidden></button><p id="aiMsg" class="err" role="alert"></p>
<label><input type="checkbox" id="overwrite"> <span data-i18n="popup.overwrite"></span></label>
<p id="status" role="status"></p>
<div id="missing" role="status"></div>
</div>
<a href="#" id="opts" data-i18n="popup.edit"></a> · <span data-i18n="popup.shortcut"></span>
<button type="button" id="lockLink" data-i18n="lock.now" hidden></button>
<p style="margin:10px 0 0"><a href="history.html" target="_blank" data-i18n="popup.history"></a> · <a href="onboarding.html" target="_blank" data-i18n="popup.help"></a></p>
<div id="langBox"></div>
<script src="i18n.js"></script><script src="security.js"></script><script src="runner.js"></script><script src="ai.js"></script><script src="popup-security.js"></script><script src="popup.js"></script><script src="popup-ai.js"></script>
</body></html>
